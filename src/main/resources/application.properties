spring.application.name=appconfig-demo
server.port=8080

# Azure App Configuration
spring.cloud.azure.appconfiguration.stores[0].endpoint=https://YOUR_APPCONFIG_NAME.azconfig.io
spring.cloud.azure.appconfiguration.stores[0].monitoring.enabled=false

# Optional: Use labels for environment-specific config
# spring.cloud.azure.appconfiguration.stores[0].selects[0].label-filter=dev

# Azure Key Vault (referenced from App Configuration)
spring.cloud.azure.keyvault.secret.property-sources[0].endpoint=https://YOUR_KEYVAULT_NAME.vault.azure.net/

# Authentication via DefaultAzureCredential (supports local dev and production)
# Locally: Uses Azure CLI login (az login)
# Production: Uses Managed Identity automatically
spring.cloud.azure.credential.managed-identity-enabled=true

# Logging
logging.level.com.azure.spring=INFO
logging.level.com.example.appconfig=DEBUG
